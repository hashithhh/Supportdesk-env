name: supportdesk-openenv
version: 0.1.0
description: Deterministic customer support triage and resolution environment for training and evaluating agents.
entrypoint:
  app: main:app
runtime:
  host: 0.0.0.0
  port: 7860
endpoints:
  reset: POST /reset
  step: POST /step
  state: GET /state/{episode_id}
additional_endpoints:
  tasks: GET /tasks
  grader: POST /grader
  baseline: POST /baseline
  action_schema: GET /action_schema
tasks:
  - task_id: billing_duplicate_charge
    difficulty: easy
  - task_id: security_compromised_account
    difficulty: medium
  - task_id: logistics_missing_order_vip
    difficulty: hard

